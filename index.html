<body class="bg-black text-white">

    <nav class="navbar navbar-expand-lg border-bottom border-dark fixed-top bg-black">

                <button class="btn border-start border-secondary position-absolute end-0 top-50 translate-middle-y px-3 text-secondary">🔍</button>
            </div>

            <div class="d-flex align-items-center gap-3">
                <button class="btn btn-outline-light fw-bold d-none d-sm-block">+ Upload</button>
                <button class="btn btn-danger fw-bold px-4 tt-red-bg">Log in</button>
            </div>
        </div>
    </nav>

    <div class="container-fluid main-wrapper">
        <div class="row">
            <aside class="col-lg-3 d-none d-lg-block border-end border-dark sidebar-fixed">
                <div class="nav flex-column gap-2 p-3">
                    <a href="#" class="nav-link text-white active-link fs-5 fw-bold"><span class="me-3">🏠</span> For You</a>
                    <a href="#" class="nav-link text-secondary fs-5 fw-bold"><span class="me-3">👥</span> Following</a>

                    <button class="btn btn-outline-danger w-100 fw-bold py-2">Log in</button>
                </div>
            </aside>

            <main class="col-12 col-lg-9 content-scroll p-0">
                <div class="sticky-tabs bg-black border-bottom border-dark px-4">
                    <div class="d-flex gap-4 overflow-auto py-3 no-scrollbar" id="category-tabs">
                        <span class="tab-item active" data-cat="all">All</span>
                        <span class="tab-item" data-cat="singing">Singing</span>
                        <span class="tab-item" data-cat="dancing">Dancing</span>
                        <span class="tab-item" data-cat="comedy">Comedy</span>
                        <span class="tab-item" data-cat="sports">Sports</span>
                        <span class="tab-item" data-cat="anime">Anime</span>
                        <span class="tab-item" data-cat="gaming">Gaming</span>

                    <div class="row g-3" id="explore-grid">

                <footer class="p-5 border-top border-dark text-center text-secondary">

                    <p class="mb-0">SAMER SAEID Made by ♥️ <a href="https://bio.link/samer" target="_blank" class="text-white text-decoration-none fw-bold">Follow Me</a></p>
